name: Release libraries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out sources and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1.
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0.
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chrome and system dependencies
        run: bunx --bun playwright install --with-deps chrome

      - name: Build libraries
        run: bun run build

      - name: Verify every icon
        run: bun run verify

      - name: Generate comparison preview
        run: bun run preview

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes-file .github/release-notes.md \
            outputs/*.excalidrawlib \
            outputs/LICENSE-*.txt \
            outputs/*-report.json \
            outputs/preview-comparison.png
